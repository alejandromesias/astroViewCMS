# Dependency updates (WORKPLAN 2.1o). A pull request from here is a normal branch: CI runs on it
# and it merges when `fast`, `e2e` and `mutation-diff` are green.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # TypeScript 7 stays out until dependency-cruiser supports it (it needs typescript < 7).
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
