# Whole-repo mutation run (WORKPLAN 2.1l), nightly and by hand. One shard per Stryker group; each shard runs every
# file of its group with that group's config (scripts/lib/stryker-plan.ts). The merge job judges the whole run: it
# fails under the overall floor of 75 and lists the files under 80. Its summary.json is the per-file baseline.
name: mutation-full

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard:
    name: mutation ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        # The groups of scripts/lib/stryker-plan.ts. A new group needs a line here too.
        group: [serve, preview, renderer, protocol, contract, cms-server]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: CI git identity (the git tests commit)
        run: |
          git config --global user.name "astroViewCMS CI"
          git config --global user.email "ci@users.noreply.github.com"
      - name: Install dependencies
        run: npm ci
      - name: Stryker, every file of the group
        run: node scripts/stryker-changed.ts --all --group ${{ matrix.group }} --run
      - name: Upload the group's reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-${{ matrix.group }}
          path: reports/mutation-diff/${{ matrix.group }}
          retention-days: 90
          if-no-files-found: ignore

  merge:
    name: whole-run verdict and baseline
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: read lets the trend step download the last runs' baselines (WORKPLAN 2.1p).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Download the shard reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mutation-*
          path: reports/mutation-diff
      - name: Judge the whole run
        run: node scripts/stryker-summary.ts --full
      - name: Upload the per-file baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-baseline
          path: reports/mutation-diff/summary.json
          retention-days: 90
      - name: Trend of the last 10 whole-repo runs (not a gate)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports/trend
          # This run first; its baseline is not an artifact of another run yet.
          if [ -f reports/mutation-diff/summary.json ]; then
            mkdir -p "reports/trend/$(date -u +%Y-%m-%dT%H-%M)-current"
            cp reports/mutation-diff/summary.json "reports/trend/$(date -u +%Y-%m-%dT%H-%M)-current/"
          fi
          gh run list --workflow mutation-full.yml --status success --limit 10 \
            --json databaseId,createdAt,headSha \
            -q '.[] | "\(.databaseId) \(.createdAt) \(.headSha[0:7])"' > reports/trend/runs.txt
          while read -r id created sha; do
            dir="reports/trend/${created//:/-}-$sha"
            mkdir -p "$dir"
            gh run download "$id" -n mutation-baseline -D "$dir" </dev/null || rm -rf "$dir"
          done < reports/trend/runs.txt
          mapfile -t folders < <(find reports/trend -mindepth 1 -maxdepth 1 -type d | sort)
          node scripts/trend.ts "${folders[@]}" >> "$GITHUB_STEP_SUMMARY"
