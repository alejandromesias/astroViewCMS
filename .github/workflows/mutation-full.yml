# Whole-repo mutation run (WORKPLAN 2.1l and 2.1s), nightly and by hand. One shard per Stryker group; each shard runs every
# file of its group with that group's config (scripts/lib/stryker-plan.ts). The merge job judges the whole run: it
# fails under the overall floor of 75 and lists the files under 80. Its summary.json is the per-file baseline.
name: mutation-full

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The nightly run is skipped when nothing outside DOCS/ changed on main since the last green run of this
  # workflow (WORKPLAN 2.1s). A run by hand always runs.
  gate:
    name: is there anything new to mutate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = schedule ]; then
            last=$(gh run list --workflow mutation-full.yml --status success --limit 1 --json headSha -q '.[0].headSha // ""')
            if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null && git diff --quiet "$last" HEAD -- . ':!DOCS'; then
              run=false
              echo "Nothing outside DOCS/ changed since the last green run ($last): skipped." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  shard:
    name: mutation ${{ matrix.group }}
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The groups of scripts/lib/stryker-plan.ts. A new group needs a line here too.
        group:
          [
            serve,
            preview,
            renderer,
            protocol,
            contract,
            cms-preview,
            cms-save,
            cms-documents,
            cms-git,
            cms-codecs,
            cms-server,
            cms-editor,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: CI git identity (the git tests commit)
        run: |
          git config --global user.name "astroViewCMS CI"
          git config --global user.email "ci@users.noreply.github.com"
      - name: Install dependencies
        run: npm ci
      - name: Stryker, every file of the group
        run: node scripts/stryker-changed.ts --all --group ${{ matrix.group }} --run
      - name: Upload the group's reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ matrix.group }}
          path: reports/mutation-diff/${{ matrix.group }}
          retention-days: 90
          if-no-files-found: ignore

  merge:
    name: whole-run verdict and baseline
    needs: [gate, shard]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: read lets the trend step download the last runs' baselines (WORKPLAN 2.1p).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Download the shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-*
          path: reports/mutation-diff
      - name: Judge the whole run
        run: node scripts/stryker-summary.ts --full
      - name: Upload the per-file baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-baseline
          path: reports/mutation-diff/summary.json
          retention-days: 90
      - name: Trend of the last 10 whole-repo runs (not a gate)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports/trend
          # This run first; its baseline is not an artifact of another run yet.
          if [ -f reports/mutation-diff/summary.json ]; then
            mkdir -p "reports/trend/$(date -u +%Y-%m-%dT%H-%M)-current"
            cp reports/mutation-diff/summary.json "reports/trend/$(date -u +%Y-%m-%dT%H-%M)-current/"
          fi
          # A night the gate skipped is a successful run with no baseline: look through 30 runs, keep 10.
          gh run list --workflow mutation-full.yml --status success --limit 30 \
            --json databaseId,createdAt,headSha \
            -q '.[] | "\(.databaseId) \(.createdAt) \(.headSha[0:7])"' > reports/trend/runs.txt
          kept=0
          while read -r id created sha; do
            [ "$kept" -ge 10 ] && break
            dir="reports/trend/${created//:/-}-$sha"
            mkdir -p "$dir"
            if gh run download "$id" -n mutation-baseline -D "$dir" </dev/null; then kept=$((kept + 1)); else rm -rf "$dir"; fi
          done < reports/trend/runs.txt
          mapfile -t folders < <(find reports/trend -mindepth 1 -maxdepth 1 -type d | sort)
          node scripts/trend.ts "${folders[@]}" >> "$GITHUB_STEP_SUMMARY"
