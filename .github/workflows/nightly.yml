# Nightly measurements (WORKPLAN 2.1p): the memory of one preview process and the listing-route tripwire, as
# their scripts print them, kept 90 days. Not a gate: the job is continue-on-error. Parsing the printed numbers
# into JSON is a later step, once a few nights show which numbers matter.
name: nightly measurements

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: memory and listing routes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Memory of one preview process
        run: |
          mkdir -p reports/nightly
          node scripts/measure-memory.mjs > reports/nightly/memory.txt 2>&1
      - name: Listing-route tripwire
        run: node scripts/measure-listing-routes.mjs > reports/nightly/listing-routes.txt 2>&1
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-measurements
          path: reports/nightly
          retention-days: 90
          if-no-files-found: ignore
