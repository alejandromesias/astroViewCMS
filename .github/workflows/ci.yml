# CI (WORKPLAN 2.1k and 2.1l). Gates: `fast` (the npm run check --fast set), `e2e` (end-to-end and browser
# suites) and `mutation-diff` (Stryker on the files the branch changed). The nightly whole-repo run is
# mutation-full.yml. Runs on push to main, pull requests and by hand. Read-only token: no secret is needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: fast gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install osv-scanner (pinned version, checksum checked)
        run: |
          BASE=https://github.com/google/osv-scanner/releases/download/v2.7.0
          cd "$RUNNER_TEMP"
          curl -fsSL -O "$BASE/osv-scanner_linux_amd64"
          curl -fsSL -O "$BASE/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum -c -
          chmod +x osv-scanner_linux_amd64
          mv osv-scanner_linux_amd64 osv-scanner
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: CI git identity (the git tests commit)
        run: |
          git config --global user.name "astroViewCMS CI"
          git config --global user.email "ci@users.noreply.github.com"
      - name: Install dependencies
        run: npm ci
      - name: Fast gates
        run: npm run check -- --fast
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: reports/coverage
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: e2e and browser
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for the browser suite
        run: npx playwright install --with-deps chromium
      - name: cms-server end-to-end
        run: npm run test:e2e -w cms-server
      - name: preview end-to-end and budgets
        run: npm run test:e2e -w preview-render-server
      - name: browser suite
        run: npm run test:browser -w preview-render-server

  mutation-diff:
    # Stryker on the source files this branch changed (against origin/main). Blocks when the changed set scores
    # under 75 overall, or a file under 80 unless .mutation-waivers.json lowers its floor (WORKPLAN 2.1l).
    # On main the changed set is empty, so the job passes at once.
    name: mutation on changed files
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: CI git identity (the git tests commit)
        run: |
          git config --global user.name "astroViewCMS CI"
          git config --global user.email "ci@users.noreply.github.com"
      - name: Install dependencies
        run: npm ci
      - name: Stryker on the changed files
        run: node scripts/stryker-changed.ts --run
      - name: Upload the Stryker reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-diff
          path: reports/mutation-diff
          retention-days: 14
          if-no-files-found: ignore
