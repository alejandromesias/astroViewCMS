# Weekly unit run on Windows (WORKPLAN 2.1p). Not a required check: a red run here is the signal. The code is written on
# Windows, and CRLF, path, case and symlink differences show there first. CI=true makes a skipped symlink test fail.
name: windows

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests on Windows
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests and coverage floors
        run: npm run coverage
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-coverage
          path: reports/coverage
          retention-days: 14
          if-no-files-found: ignore
  # The memory budget of cms-server (decision R8, option B; metric changed 2026-11-25 to commit charge; WORKPLAN 2.13a):
  # fails when commit charge grows more than 30 MB from save 10 to save 50, or is over 450 MB at save 50. Its own job, so
  # a red unit run does not hide its result.
  memory:
    name: cms-server memory budget on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Memory of cms-server after 50 saves
        run: npm run measure:cms-memory
