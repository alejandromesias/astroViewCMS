# Weekly unit run and the start e2e test on macOS (WORKPLAN 2.14g). Not a required check: a red run here is the signal.
# The steps mirror windows.yml (2.1p) on macos-latest. The e2e step runs the one start test under cms-server's e2e
# config (vitest.e2e.config.ts, as `npm run test:e2e -w cms-server` does in ci.yml). It runs even when the unit step fails.
name: macos

on:
  schedule:
    - cron: '41 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests and start e2e on macOS
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests and coverage floors
        run: npm run coverage
      - name: start end-to-end test
        if: always()
        run: npm run test:e2e -w cms-server -- test/e2e/start.e2e.test.ts
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-coverage
          path: reports/coverage
          retention-days: 14
          if-no-files-found: ignore
