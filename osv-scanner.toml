# Every entry needs a reason and an expiry (at most three months out). An
# expired entry makes `npm run audit` fail again. See DOCS/Historic/QUALITY-TOOLING-PLAN.md step 5.

# minimatch 10.2.6 <- @stryker-mutator/core 10.1.1, the latest Stryker, which pins ~10.2.4.
# The only fix is minimatch 11.0.1 (major, outside Stryker's range); no 10.x release is patched,
# and an override to 11 would be a breaking bump, so it is not applied. Dev tool only (mutation
# testing); the glob patterns come from our own Stryker config and it does not ship.
# Recheck when Stryker publishes a release that accepts minimatch 11.
[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-15
reason = "minimatch 10.2.6 via @stryker-mutator/core 10.1.1 (pins ~10.2.4; fix 11.0.1 is major and out of range). Dev only, not shipped; globs come from our own Stryker config"

# picomatch 4.0.7 and 2.3.2 (ReDoS through repeated extglobs). No patched release exists.
# Production tree (npm ls picomatch --omit=dev): astro and @astrojs/node, both in
# preview-render-server, pull picomatch 4.0.7; astro also pulls 2.3.2 via unstorage/anymatch;
# sample-site's vite pulls 4.0.7. Dev tools (vitest, knip, dependency-cruiser) add more.
# Verified: astro's content glob loader passes config-authored patterns to picomatch.
# Not verified: whether any request-time path passes untrusted input to picomatch. The
# waiver assumes it does not.
# IgnoredVulns matches by advisory ID, so this also covers any picomatch <= 4.0.7 added later.
# Recheck when a patched picomatch is released, or when astro, @astrojs/node or vite move
# to a newer picomatch.
[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2026-12-17
reason = "picomatch 4.0.7 and 2.3.2 via astro and @astrojs/node (production, preview-render-server), sample-site vite, and dev tools. No patched release. Verified: astro's glob loader takes config-authored patterns. Not verified: request-time input"
